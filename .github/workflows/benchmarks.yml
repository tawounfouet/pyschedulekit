name: Performance Benchmarks

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "benchmarks/**"
      - "tests/acceptance/test_benchmark_harness.py"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Benchmark workload profile."
        required: true
        default: "standard"
        type: choice
        options:
          - smoke
          - standard
      python_version:
        description: "Python version used for the benchmark run."
        required: true
        default: "3.13"
        type: choice
        options:
          - "3.11"
          - "3.12"
          - "3.13"

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark ${{ inputs.profile || 'standard' }} on Python ${{ inputs.python_version || '3.13' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python_version || '3.13' }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run benchmark harness
        run: |
          python benchmarks/run.py \
            --profile "${{ inputs.profile || 'standard' }}" \
            --json-out benchmark-results.json \
            --markdown-out benchmark-results.md

      - name: Publish report to workflow summary
        shell: bash
        run: cat benchmark-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: benchmark-${{ inputs.profile || 'standard' }}-py${{ inputs.python_version || '3.13' }}
          path: |
            benchmark-results.json
            benchmark-results.md
          if-no-files-found: error
          retention-days: 30
