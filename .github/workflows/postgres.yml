name: PostgreSQL Qualification

on:
  push:
    branches:
      - main
    paths:
      - "src/pyschedulekit/infrastructure/postgres*.py"
      - "tests/integration/postgres/**"
      - "tests/integration/infrastructure/test_adapter_parity.py"
      - "tests/architecture/test_postgres_optional_dependency.py"
      - "tests/architecture/test_postgres_public_boundary.py"
      - "tests/architecture/test_postgres_coverage_policy.py"
      - ".coveragerc-postgres"
      - ".github/workflows/postgres.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/pyschedulekit/infrastructure/postgres*.py"
      - "tests/integration/postgres/**"
      - "tests/integration/infrastructure/test_adapter_parity.py"
      - "tests/architecture/test_postgres_optional_dependency.py"
      - "tests/architecture/test_postgres_public_boundary.py"
      - "tests/architecture/test_postgres_coverage_policy.py"
      - ".coveragerc-postgres"
      - ".github/workflows/postgres.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: PostgreSQL ${{ matrix.postgres }} adapter qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pyschedulekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pyschedulekit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYSCHEDULEKIT_TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/pyschedulekit

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PostgreSQL development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres-pool]"

      - name: Run PostgreSQL adapter qualification
        run: |
          pytest -q \
            tests/integration/postgres \
            tests/integration/infrastructure/test_adapter_parity.py \
            tests/architecture/test_postgres_optional_dependency.py \
            tests/architecture/test_postgres_public_boundary.py \
            tests/architecture/test_postgres_coverage_policy.py \
            --cov=pyschedulekit.infrastructure.postgres \
            --cov=pyschedulekit.infrastructure.postgres_schema \
            --cov-config=.coveragerc-postgres \
            --cov-report=term-missing
