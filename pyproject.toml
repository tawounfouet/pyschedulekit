[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyschedulekit"
dynamic = ["version"]
description = "A domain-first Python scheduling framework built to make scheduling semantics explicit, testable, and durable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "PyScheduleKit contributors" },
]
keywords = ["scheduling", "scheduler", "cron", "python", "domain-driven-design"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pre-commit>=3.7",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.16.1",
]
release = [
  "build>=1.2",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/tawounfouet/pyschedulekit"
Repository = "https://github.com/tawounfouet/pyschedulekit"
Issues = "https://github.com/tawounfouet/pyschedulekit/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "pyschedulekit._version.__version__" }

[tool.setuptools.package-data]
pyschedulekit = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pyschedulekit"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["session-ses_*.md"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
mypy_path = "src"
